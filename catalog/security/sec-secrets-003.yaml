id: sec-secrets-003
bundle: security
category: secrets-exposure
variant_group_id: secrets-exposure   # same "this app leaks a secret" finding as sec-secrets-001/002 -> one finding
pool: public
evidence_model: provable
penalty: 92   # nominal only; severity_ref resolves it, and validated_live is the rung that applies here.
              # A Google AIza key that REACHES the Gemini API is an inference credential in a public bundle:
              # strangers spend this project's budget and can read its uploaded files and cached content.
              # NOT high_privilege (that rung is admin / service-role / private-key tier, which this is not).
              #
              # This is the only probe that asks a THIRD PARTY rather than the target, because the format is
              # undecidable otherwise: the same 39 characters serve a public-by-design Firebase web key and a
              # Gemini billing key, and an existing Firebase key silently gains Gemini access when that API is
              # enabled on the project (Truffle Security, Feb 2026). Confirming with Google is what keeps the
              # public-by-design case from ever being scored. Without it a team wrapping OpenAI or Anthropic is
              # caught by a format match while a team wrapping Gemini is invisible, which is bias in the ruler
              # rather than a recall gap.
              #
              # ACTIVE battery only (safety.PASSIVE_PROBES is fail-closed, so a new id is active by default):
              # it spends one request against the app owner's own credential, so it belongs where ownership
              # was attested, never in the passive lane that grades a stranger's URL.
severity_ref: disclosed-secret
applicability:
  requires: [at_least_one_http_endpoint_exists]
probe:
  predicate: gemini_key_live_in_bundle
