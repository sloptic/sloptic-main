[project]
name = "sloptic"
version = "1.1.0"
description = "Sloptic, a black-box HTTP resilience grader: deploys a web app, probes it over HTTP, and emits a slop score (deduction-only, lower is better)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# Browser-rendered probes (SPA form discovery, axe-core accessibility, Core Web Vitals, DOM XSS). Optional:
# the base install grades everything reachable over httpx. `pip install sloptic[browser]`, then
# `playwright install chromium`. 1.61 is the FLOOR because it is the release that added Ubuntu 26.04 support
# (microsoft/playwright#40117); 1.60 cannot fetch a browser there at all, and the >= alone does not save you
# if a lockfile pins 1.60. Bumping 1.60->1.61 left a supavulnbase grade byte-identical (slop 328, same axes /
# applicable / surface / findings), so it is not a known score confound; the rendering-fed axes (qa-a11y via
# axe-core, perf-cwv, sec-domxss-001) would move first if a future bump ever does, so re-check those three then.
browser = ["playwright>=1.61.0"]

[project.scripts]
sloptic = "sloptic.cli:main"

[project.urls]
Homepage = "https://github.com/sloptic/sloptic-main"
Repository = "https://github.com/sloptic/sloptic-main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sloptic"]
# probes are DATA (catalog/**/*.yaml), a sibling of the package in the repo; ship it INSIDE the wheel at
# sloptic/catalog so an installed grader has its battery. The loader (catalog.default_catalog_dir) checks the
# packaged copy first, then the repo-root sibling used in development. NOTE: build/publish from the PUBLIC
# mirror only -- the exclude drops any local hidden pool, but the mirror is the authoritative clean source.
exclude = ["**/hidden/**", "**/catalog-hidden/**"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "sloptic/catalog"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
