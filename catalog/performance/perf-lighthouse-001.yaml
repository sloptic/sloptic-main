id: perf-lighthouse-001
bundle: performance
category: overall
pool: public
evidence_model: oracle
penalty: 50   # NOMINAL only. The real slop = penalty_override = round(max(0, green_floor - perf_score) * 100 * scale):
              # the SHORTFALL below Lighthouse's own green line (0.90). At/above green -> 0; an 84 -> 6, a 25 -> 65.
              # Lighthouse does the scoring off its calibrated weights; we charge only the distance below "good". Median-of-3.
applicability:
  requires: [lighthouse]
probe:
  predicate: lighthouse_perf_score
  green_floor: 0.90   # Lighthouse's green cutoff: score >= this -> no perf slop (a clean, achievable, meaningful 0);
                      # flooring at green (not 100) also refuses to score the 90-100 measurement jitter
  scale: 1.0          # weigh the whole perf axis: 1.0 = full; drop below 1.0 to soften it without touching code
