id: sec-headers-003
bundle: security
category: security-headers
pool: public
evidence_model: provable
penalty: 5
severity: {cvss: "n/a", vrt: "P5", range: [5, 5], default: 5, tier: chore-floor}   # HSTS
applicability:
  requires: [served_over_https]   # HSTS is meaningless over plain HTTP -> N/A unless the target is HTTPS
probe:
  target: /
slop_if:
  - response_missing_header: strict-transport-security
