id: sec-session-002
bundle: security
category: session
pool: public
evidence_model: oracle
penalty: 15   # a session cookie without SameSite is sendable cross-site (CSRF surface)
severity: {cvss: "n/a", vrt: "P5", range: [12, 12], default: 12}   # SameSite missing; REPRICED 15->12
applicability:
  requires: [has_auth_entrypoint]
probe:
  predicate: session_cookie_missing_flag
  flag: samesite
