id: perf-ttfb-001
bundle: performance
category: speed
pool: public
evidence_model: oracle
penalty: 26   # PROVISIONAL (re-priced on v19). Slow server response (TTFB). Lighthouse server-response-time.
              # needs=600ms half, fail=1500ms full -- tiering collapses the old 3 TTFB tiers into one (the old
              # ttfb-001 measured a synthetic /heavy path single-shot; that's gone).
applicability:
  requires: [lighthouse]
probe:
  predicate: lighthouse_audit
  report_only: true   # OFF-SCORE: fires as a per-metric diagnostic finding at 0 penalty;
                      # the perf axis is scored once on the overall headline (perf-lighthouse-001).
  audit: server-response-time
  mode: numeric
  needs_above: 600
  fail_above: 1500
