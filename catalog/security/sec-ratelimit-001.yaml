id: sec-ratelimit-001
bundle: security
category: rate-limiting
pool: public
evidence_model: oracle
penalty: 15   # nominal fallback (severity block below). Rate limiting is CWE-770/799 (resource / interaction-
              # frequency abuse), NOT just login brute-force: also account enumeration, signup/contact spam,
              # OTP/email flooding, scraping, and cost-amplification (an unthrottled paid-LLM endpoint = a
              # financial DoS). Tested surface here = login; the broader surface is a coverage-backlog probe.
severity: {cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N", cvss_score: 5.3, vrt: "P4", range: [30, 30], default: 30}   # REPRICED 15->30 (VRT P4)
applicability:
  # not gated on a discovered HTML password form: the predicate itself finds the login surface
  # (HTML form OR JSON-API endpoint like /rest/user/login) and returns N/A when neither exists.
  requires: [at_least_one_http_endpoint_exists, not_edge_managed]   # v2.0: N/A on managed-edge hosts (vercel/netlify/cloudflare/...) -- the platform owns rate-limiting/scaling, not the team
probe:
  predicate: login_no_rate_limit
  attempts: 10   # wrong-password logins to fire; slop if none is throttled (429/423)
tp_definition: |
  TP: a REAL credential-checking login endpoint accepts unlimited wrong-password attempts (no throttle) ->
  brute-forceable.
  NOT (confounders/FP): no real login was found / the detected 'login' is not a credential gate (a 2xx
  success or a non-rejecting form); a GET-method 'login form' (creds-in-query / SPA onSubmit stub, not the
  POST credential endpoint -> JSON fallback); a transport redirect (http->https / host canonicalization to
  the SAME path) mistaken for an auth rejection; or throttling masked by the grader's OWN concurrency (a
  load confounder -- trustworthy only graded in isolation).
