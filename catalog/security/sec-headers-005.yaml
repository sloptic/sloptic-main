id: sec-headers-005
bundle: security
category: security-headers
pool: public
evidence_model: provable
penalty: 2
severity: {cvss: "n/a", vrt: "P5", range: [2, 2], default: 2, tier: chore-floor}   # Referrer-Policy
applicability:
  requires: [at_least_one_http_endpoint_exists]
probe:
  target: /   # Referrer-Policy is a global response header -> check once on the homepage
slop_if:
  - response_missing_header: referrer-policy
