id: sec-hosthdr-001
bundle: security
category: host-header
pool: public
evidence_model: provable
penalty: 15   # a trusted Host/X-Forwarded-Host -> web-cache poisoning + password-reset-link poisoning
severity: {cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N", cvss_score: 6.1, vrt: "n/a", range: [40, 40], default: 40}   # CVSS-only (no VRT); REPRICED 15->40
applicability:
  requires: [at_least_one_http_endpoint_exists]
probe:
  # inject a unique marker host via Host / X-Forwarded-Host across the homepage + likely reset/link
  # routes; fire if it reflects into a redirect Location or the body
  predicate: host_header_injection
