id: sec-exposure-001
bundle: security
category: exposure
pool: public
evidence_model: provable
penalty: 35   # a served .env hands DB credentials + secret keys to any anonymous visitor
severity: {cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", cvss_score: 7.5, vrt: "P1", range: [90, 90], default: 90}   # served .env = DB creds to anyone; REPRICED 35->90
applicability:
  requires: [at_least_one_http_endpoint_exists]
probe:
  target: /.env
slop_if:
  - response_is_dotenv
