id: sec-exposure-005
bundle: security
category: data-exposure
variant_group_id: credential-exposure   # "this app returns credentials" = one finding, however many routes
pool: public
evidence_model: provable
penalty: 35   # returning password material to a client is top-tier excessive-data-exposure (OWASP API3)
severity_ref: disclosed-secret
applicability:
  requires: [at_least_one_http_endpoint_exists]
probe:
  target: routes   # scan every discovered route/endpoint (incl. spec-derived) for leaked credentials
  na_if_absent: true
  # PRECISION (v18 live-audit): a "password":"<value>" is a leak only when the VALUE is a real credential, not a
  # UI/i18n LABEL -- a /api/translate strings endpoint returns "password":"Password" / "Enter your password".
  # A phrase of words ending in "password" (or a bullet placeholder) is excluded; a real value with digits/
  # symbols still fires (edy /api/pedidos leaked "EdyDemo6717!" -> a genuine TP, kept).
slop_if:
  - response_leaks_credentials
