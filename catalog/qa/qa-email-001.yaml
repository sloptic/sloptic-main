id: qa-email-001
bundle: qa
category: email-verification
pool: public
evidence_model: provable
# REPORT_ONLY in v1 (the predicate forces off-score) until the corpus admission-test validates the family; the
# severity below is what it takes once promoted. An EVIDENCE LADDER on the reliability of the signup email flow
# (functional-suitability, Nielsen 4 -- account creation is a core feature many others depend on):
#   72  no email within 60s even after a resend -> the user is locked out (the catastrophe)
#   24  email arrived only after the 30s checkpoint (late / only after resend) -> an unreliable send
#    5  a working signup that offers NO resend control -> a resilience gap (a good app lets you re-request)
severity:
  iso_25010: "functional-suitability"
  nielsen: "4"
  range: [5, 72]
  default: 5
  escalators:
    - {evidence: email_late_30s, point: 24, vrt_variant: "email missed the 30s checkpoint (late / only after resend) -- unreliable send"}
    - {evidence: no_email_60s, point: 72, vrt_variant: "no email within 60s even after a resend -> locked out"}
applicability:
  requires: [has_auth_entrypoint]
probe:
  predicate: email_never_arrives
tp_definition: |
  TP: an email-verification-gated signup whose flow is unreliable -- no email in 60s even after clicking resend
  (locked out), OR the email only arrived after the 30s mark (unreliable send), OR a working signup that offers
  no way to resend the confirmation (a resilience gap; users are expected to get several chances).
  NOT (confounders): signup is not email-gated (logs in immediately, or wants a separate login with no
  confirm-email language and no mail) -> N/A; a CAPTCHA/SSO blocks registration -> N/A.
