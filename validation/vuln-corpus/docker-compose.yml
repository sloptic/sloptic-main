# Deliberately-vulnerable app corpus for RECALL validation: point the fuzzer at each and confirm it
# catches the known vulns. These apps are BUILT TO BE HACKED, so every port binds to 127.0.0.1 only --
# never expose this corpus to a network. `docker compose up -d` to bring it up, then run setup.sh once
# (DVWA and bWAPP need their DB initialized before they serve vulnerable surface).
name: hacklet-vuln-corpus

services:
  dvwa:            # classic PHP web vulns (SQLi, XSS, CSRF, upload, LFI, command injection). MySQL bundled.
    image: vulnerables/web-dvwa
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped

  bwapp:           # "buggy web app" -- a very wide PHP bug surface. MySQL bundled.
    image: raesene/bwapp
    ports: ["127.0.0.1:8082:80"]
    restart: unless-stopped

  juice-shop:      # modern Node/Angular SPA (the form-less, JS-bundle-mined case). Self-contained, no setup.
    image: bkimminich/juice-shop
    ports: ["127.0.0.1:8083:3000"]
    restart: unless-stopped

  vampi:           # vulnerable REST API (Flask + OpenAPI). Exercises the JSON-API / spec-discovery path.
    image: erev0s/vampi
    environment: [vulnerable=1]
    ports: ["127.0.0.1:8084:5000"]
    restart: unless-stopped

  oopssec:         # intentionally-vulnerable Next.js + React store (the MODERN SPA case) — SQLite auto-seeds
    image: leogra/oss-oopssec-store   # on first start; self-registerable, 35 CTF challenges: XSS/CSRF/IDOR/JWT/
    # Published on 3000, NOT a tidier 8085, and that is load-bearing. The image bakes
    # NEXT_PUBLIC_BASE_URL=http://localhost:3000 into the CLIENT BUNDLE at build time, so the browser posts its
    # registration to an ABSOLUTE http://localhost:3000/api/auth/signup. Publish it anywhere else and that POST
    # lands on a dead address: signup silently fails, no session cookie comes back, and all eleven authed probes
    # (IDOR x5, session x4, CSRF, upload x2) read N/A — the exact surface this anchor exists to exercise.
    # Overriding the env instead does NOT work: NEXT_PUBLIC_* is inlined at build time so the bundle ignores it,
    # while the Next SERVER reads it at runtime and tries to fetch the host port from inside the container
    # (ECONNREFUSED -> the homepage 500s). Matching the baked default is the only fix that holds both sides.
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
