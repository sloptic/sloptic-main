id: sec-dos-001
bundle: security
category: dos-resistance
pool: public
evidence_model: provable
penalty: 12   # decompresses gzip request bodies with no size cap -> a zip bomb exhausts memory (DoS)
severity: {cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", cvss_score: 7.5, vrt: "P4", range: [15, 15], default: 15}   # DoS via decompression bomb (missing size-cap); REPRICED 12->15
applicability:
  requires: [at_least_one_http_endpoint_exists]
probe:
  # confirm the endpoint decompresses request bodies, then send a ~50MB-expanding (safe) bomb;
  # fire unless it's rejected with 413 (a decompressed-size cap). Detects the missing defense, never OOMs.
  # PRECISION (v18 live-audit, 3/4 FP): the 10KB size-control MUST be a live 2xx. If it 404s/400s, the endpoint
  # isn't a live body handler and the 50MB->500 is infra rejecting a huge upload to a dead/wrong route, not
  # decompression exhaustion (v18: /ingest & /api/ingest 404 controls, /api/auth/login 400).
  predicate: decompression_bomb
